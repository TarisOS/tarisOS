# Modified for TarisOS (Taris Music) by George Dobreff ("Witcher") and contributors, 2026.
[package]
name = "taris-music"
version = "1.4.0"
description = "Taris Music, TarisOS's music player"
authors = ["noFAYZ and contributors", "George Dobreff (\"Witcher\") and contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "taris_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-localhost = "2"
tauri-plugin-single-instance = "2"
portpicker = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream"] }
base64 = "0.22"
url = "2.5"
keyring = { version = "3.6", features = ["sync-secret-service"] }
discord-rich-presence = "0.2"
tauri-plugin-dialog = "2"
md5 = "0.8.0"
lofty = "0.24.0"
notify = "8.2.0"
futures-util = "0.3.33"
# Already in the tree via tauri; declared directly for `sleep` in the range-retry backoff
# and the semaphore that serialises playback fills.
tokio = { version = "1", features = ["sync", "time"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all"] }
# Demuxing only, and pinned to the version rodio already pulls so the binary carries one copy
# of the Matroska/Ogg readers rather than two.
symphonia = { version = "0.5", default-features = false, features = ["mkv", "ogg"] }
# libopus, built from source via cmake. symphonia has no Opus decoder at all, and YouTube
# serves Opus-in-WebM for the large majority of tracks at `high` — and as the *only* audio
# offered for many of them, so preferring AAC is not an alternative.
opus = "0.3.1"
# Account slot ids.
rand = "0.8"
# MPRIS2, for the desktop's media controls (linux_media.rs)
souvlaki = "0.7"


