# The Apple display driver (appledrm, from Asahi Linux's asahi-7.1.13-3, the kernel's own source)
# with Christian Bartels's "drm/apple: a late clear swap at power-off is not a DCP crash": a USB-C
# display unplugged while on no longer leaves its display processor marked crashed, every later
# modeset refused until a reboot. Built only for the kernel made from the same source (kernel
# release 7.1.13-3-*); any other kernel keeps its own driver.
PACKAGE_NAME="taris-appledrm"
PACKAGE_VERSION="7.1.13.3"
BUILT_MODULE_NAME[0]="appledrm"
DEST_MODULE_LOCATION[0]="/kernel/drivers/gpu/drm/apple"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
BUILD_EXCLUSIVE_KERNEL="^7\.1\.13-3-"
AUTOINSTALL="yes"
