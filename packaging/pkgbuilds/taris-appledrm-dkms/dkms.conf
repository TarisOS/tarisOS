# The Apple display driver (appledrm) with Christian Bartels's "drm/apple: a late clear swap at
# power-off is not a DCP crash": a USB-C display unplugged while on no longer leaves its display
# processor marked crashed, every later modeset refused until a reboot. For every Asahi Linux
# kernel: before each build, asahi-source.sh fetches the source of the kernel it's for and applies
# the patch; where it doesn't apply, the build stops and the kernel's own driver stays.
PACKAGE_NAME="taris-appledrm"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="appledrm"
DEST_MODULE_LOCATION[0]="/kernel/drivers/gpu/drm/apple"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
BUILD_EXCLUSIVE_KERNEL="^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[0-9]+-ARCH$"
PRE_BUILD="asahi-source.sh ${kernelver}"
AUTOINSTALL="yes"
