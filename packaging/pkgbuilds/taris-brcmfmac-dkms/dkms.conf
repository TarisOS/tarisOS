# The Broadcom Wi-Fi driver (brcmfmac) with the BCM4378's L1 substates switched on only while its
# firmware runs, in place of the kernel's own, with its three firmware-vendor modules (they use
# brcmfmac's exports, so they're built with it). Built only for the kernel made from the same
# source (Asahi Linux's asahi-7.1.13-3, kernel release 7.1.13-3-*); any other kernel keeps its own
# driver. The version is the PKGBUILD's.
PACKAGE_NAME="taris-brcmfmac"
PACKAGE_VERSION="7.1.13.3"
BUILT_MODULE_NAME[0]="brcmfmac"
BUILT_MODULE_LOCATION[0]="brcmfmac/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/wireless/broadcom/brcm80211/brcmfmac"
BUILT_MODULE_NAME[1]="brcmfmac-wcc"
BUILT_MODULE_LOCATION[1]="brcmfmac/wcc/"
DEST_MODULE_LOCATION[1]="/kernel/drivers/net/wireless/broadcom/brcm80211/brcmfmac/wcc"
BUILT_MODULE_NAME[2]="brcmfmac-cyw"
BUILT_MODULE_LOCATION[2]="brcmfmac/cyw/"
DEST_MODULE_LOCATION[2]="/kernel/drivers/net/wireless/broadcom/brcm80211/brcmfmac/cyw"
BUILT_MODULE_NAME[3]="brcmfmac-bca"
BUILT_MODULE_LOCATION[3]="brcmfmac/bca/"
DEST_MODULE_LOCATION[3]="/kernel/drivers/net/wireless/broadcom/brcm80211/brcmfmac/bca"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/brcmfmac modules"
BUILD_EXCLUSIVE_KERNEL="^7\.1\.13-3-"
AUTOINSTALL="yes"
