# What asahi-source.sh fetches and patches for the Broadcom Wi-Fi driver (brcmfmac, with the
# headers its firmware-vendor modules share)
paths=(
  drivers/net/wireless/broadcom/brcm80211/brcmfmac
  drivers/net/wireless/broadcom/brcm80211/include
)
base=drivers/net/wireless/broadcom/brcm80211
patches=(0001-wifi-brcmfmac-pcie-BCM4378-L1-substates-only-while-the-firmware-runs.patch)
notices=taris-notices.patch
