# The USB-C controller's driver (tipd) with Janne Grunau's DP alt-mode commits, in place of the
# kernel's own. Built only for the kernel made from the same source (Asahi Linux's asahi-7.1.13-3,
# kernel release 7.1.13-3-*); any other kernel keeps its own driver. The version is the PKGBUILD's.
PACKAGE_NAME="taris-tipd"
PACKAGE_VERSION="7.1.13.3"
BUILT_MODULE_NAME[0]="tps6598x-core"
DEST_MODULE_LOCATION[0]="/kernel/drivers/usb/typec/tipd"
BUILT_MODULE_NAME[1]="tps6598x"
DEST_MODULE_LOCATION[1]="/kernel/drivers/usb/typec/tipd"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
BUILD_EXCLUSIVE_KERNEL="^7\.1\.13-3-"
AUTOINSTALL="yes"
