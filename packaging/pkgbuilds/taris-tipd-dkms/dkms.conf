# The USB-C controller's driver (tipd) with Janne Grunau's DP alt-mode commits, in place of the
# kernel's own: its core and both bus drivers (I2C, SPMI), as they share the core's structures. For
# every Asahi Linux kernel: before each build, asahi-source.sh fetches the source of the kernel it's
# for and applies the patches; where they don't apply, the build stops and the kernel's own driver
# stays.
PACKAGE_NAME="taris-tipd"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="tps6598x-core"
DEST_MODULE_LOCATION[0]="/kernel/drivers/usb/typec/tipd"
BUILT_MODULE_NAME[1]="tps6598x"
DEST_MODULE_LOCATION[1]="/kernel/drivers/usb/typec/tipd"
BUILT_MODULE_NAME[2]="sn201202x"
DEST_MODULE_LOCATION[2]="/kernel/drivers/usb/typec/tipd"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
BUILD_EXCLUSIVE_KERNEL="^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[0-9]+-ARCH$"
PRE_BUILD="asahi-source.sh ${kernelver}"
AUTOINSTALL="yes"
