# The Apple Silicon Macs' Bluetooth driver (hci_bcm4377) with its sleep and wake writes flushed, in
# place of the kernel's own. Only this module is built from the Bluetooth driver folder (obj-m on
# the command line overrides the folder's Makefile). For every Asahi Linux kernel: before each
# build, asahi-source.sh fetches the source of the kernel it's for and applies the patch; where it
# doesn't apply, the build stops and the kernel's own driver stays.
PACKAGE_NAME="taris-bcm4377"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="hci_bcm4377"
DEST_MODULE_LOCATION[0]="/kernel/drivers/bluetooth"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build obj-m=hci_bcm4377.o modules"
BUILD_EXCLUSIVE_KERNEL="^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[0-9]+-ARCH$"
PRE_BUILD="asahi-source.sh ${kernelver}"
AUTOINSTALL="yes"
