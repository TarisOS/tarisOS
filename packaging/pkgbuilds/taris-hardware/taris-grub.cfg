# Fan control (the bar's fan popout): the fan driver, macsmc_hwmon, is built into the Asahi kernel
# and only takes fan speeds with this option. Read by grub-mkconfig after /etc/default/grub.
case " $GRUB_CMDLINE_LINUX_DEFAULT " in
*" macsmc_hwmon.fan_control=1 "*) ;;
*) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }macsmc_hwmon.fan_control=1" ;;
esac

# The Taris logo, centred on black, over the Asahi logo m1n1 leaves on screen until Plymouth starts
GRUB_BACKGROUND=/usr/share/taris/grub-background.png
