# Compressed swap in RAM: zstd packs memory about 3:1, so even a full device takes about a third of
# its size in RAM. Up to the size of RAM, at most 8 GB; used before any swap on disk.
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
swap-priority = 100
