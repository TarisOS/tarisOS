# No kernel auditing. journald switches it on by default, though nothing uses it here (no audit
# rules, no auditd), and once it has been on, every system call of every new process takes the
# audit path until the next boot. The events it records reach the journal anyway: PAM and sudo
# log there themselves, systemd logs services starting and stopping, systemd-coredump keeps
# crashes. Takes effect from the next boot.
[Journal]
Audit=no
