# Scheduler and memory settings that save power without costing speed or changing anything seen.

# Real-time threads (audio, threaded interrupt handlers) no longer ask for full boost. The
# kernel's default of 1024 asks for the top clock and the biggest cores, so every audio period
# and Wi-Fi interrupt ran its core at full speed, and audio could only run on the performance
# cores. They keep their priority; the clock follows their actual load. Threads that set their
# own minimum keep it.
kernel.sched_util_clamp_min_rt_default = 0

# No proactive compaction. It wakes twice a second to build contiguous memory for huge pages,
# which nothing here uses: this kernel has no transparent huge pages, and no huge pages are
# reserved. Compaction when an allocation needs it is unchanged.
vm.compaction_proactiveness = 0
