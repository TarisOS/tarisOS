# The internal keyboard and trackpad first bind to the generic HID driver and are then created again
# when hid_apple and hid_magicmouse load, while logind and the compositor are starting: on some boots
# the trackpad stays dead for the whole session. Loaded from the initramfs, they bind once. ("?":
# no error on a kernel that builds them in.)
MODULES+=(hid_apple? hid_magicmouse?)
