# An app that fills the memory is stopped before the desktop freezes. With zram, the kernel's own
# OOM killer comes only after a long stall (a dev server at 6.8 GB froze the machine until it was
# switched off), so systemd-oomd watches the account's apps instead: when they spend half their
# time waiting for memory for 20 seconds, it kills the app scope reclaiming the most (a terminal
# tab, an agent and what it runs). Hyprland and the shell run in the login session's scope, outside
# this service, so they are never candidates.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
ManagedOOMMemoryPressureDurationSec=20s
