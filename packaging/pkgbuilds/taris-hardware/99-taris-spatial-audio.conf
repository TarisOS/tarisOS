# TarisOS's spatial audio (/usr/share/wireplumber/scripts/taris/spatial-audio.lua) and its
# setting: wpctl settings --save taris.spatial-audio true|false. The profile requires a virtual
# component that only wants the script: wanted, it's loaded, and a failure in it never takes the
# sound away (an optional feature alone is never loaded).

wireplumber.settings.schema = {
	taris.spatial-audio = {
		name = "Spatial audio"
		description = "Crosstalk cancellation on the built-in speakers, virtual speakers on headphones"
		type = "bool"
		default = true
	}
}

wireplumber.components = [
	{
		name = taris/spatial-audio.lua, type = script/lua
		provides = custom.taris-spatial-audio
		requires = [ support.settings ]
	}
	{
		type = virtual, provides = custom.taris-spatial-audio.wanted
		wants = [ custom.taris-spatial-audio ]
	}
]

wireplumber.profiles = {
	main = {
		custom.taris-spatial-audio.wanted = required
	}
}
