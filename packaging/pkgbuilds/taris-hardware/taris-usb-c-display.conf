# With the USB-C display on (usb-c-display), the display driver waits for the external display
# processor, which needs the display crossbar's driver: loaded from the initramfs, the internal
# screen gets its driver there as before, not only after the switch to the real root (Plymouth and
# the disk password on the boot framebuffer). ("?": no error on a kernel that builds it in.)
MODULES+=(mux_apple_display_crossbar?)
# The display driver by name: taris-appledrm-dkms's is in updates/dkms, which the kms hook's search
# for drivers under drivers/gpu/drm/ doesn't find
MODULES+=(appledrm?)
