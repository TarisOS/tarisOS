# tiny-dfr with TarisOS's patches, built for the installed version by asahi-package.sh, in place
# of the stock binary while there's one; otherwise the stock binary runs
[Service]
BindReadOnlyPaths=-/var/lib/taris/asahi-package/tiny-dfr/current:/usr/bin/tiny-dfr
