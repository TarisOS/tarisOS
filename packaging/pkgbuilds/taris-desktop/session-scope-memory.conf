# The desktop stays responsive when the memory runs out: the login session's scope holds Hyprland,
# Xwayland and the shell (apps run in their own scopes, through run-app), and the kernel takes
# memory from everything else before it takes their first 1 GB (they use about 970 MB, most of it
# graphics buffers). A reservation, not a limit: nothing is held back while it isn't used.
[Scope]
MemoryLow=1G
