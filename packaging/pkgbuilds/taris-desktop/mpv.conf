# TarisOS's mpv settings for every account (/etc/mpv: mpv reads it before an account's own
# ~/.config/mpv/mpv.conf)

# A video stays open on its last frame when it ends, until it's closed, instead of closing its
# window
keep-open=yes

# Videos decoded by the Mac's video decoder (H.264, HEVC and VP9, through VA-API: AVD), which uses a
# fraction of the CPU, and battery, that decoding in software does; the rest in software as before
hwdec=auto-safe
