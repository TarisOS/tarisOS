# TarisOS's kitty settings for every account (/etc/xdg/kitty: kitty reads it while an account has no
# ~/.config/kitty/kitty.conf of its own)

# Kitty doesn't bring back the size and maximized state it was closed in: it asked to be maximized
# before its window was shown, which Hyprland's maximize suppression can't catch. Hyprland sizes and
# places it instead (floating, centred: /usr/share/taris/hypr/hyprland.lua).
remember_window_size no

# The background's opacity: the windows' opacity from Settings > Window style, which the shell writes
# here (kitty stays solid as a window, so only its background is see-through and its text stays
# sharp). Missing until the shell has run once: kitty then just stays solid.
include ~/.local/state/taris/terminal/kitty.conf
