# The shell holds sleep back until the session is locked (Settings > Power, lock before sleep). logind
# sleeps anyway once the delay runs out, locked or not, and its default 5 s can run out when closing
# the lid also changes the displays. A lock that's up lets go at once.
[Login]
InhibitDelayMaxSec=15
